<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container{
        display: flex;
        
        justify-content: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div>
        <div>
            <p>nhập vào chiều cao(m)</p>
            <input type="text" id="chieucao" value="">
        </div>
        <div>
            <p>nhập vào cân nặng(kg)</p>
            <input type="text" id="cannang" value="">
        <div>
            <button onclick="bmi()">tính bmi</button>            
        </div>
        <div>
            <p>kết quả</p>
            <input type ="text" id="ketqua" value="">
        </div>
     </div>
     <div>   
        <div>
            <img class="images" width="200px" src="image.png" alt="">
        </div>
      </div>
  </div>
  <script>
    function bmi(){
        let chieucao = parseFloat(document.getElementById("chieucao").value);
        let cannang = parseFloat(document.getElementById("cannang").value);
        let ketqua = cannang / (chieucao * chieucao);
        document.getElementById("ketqua").value = ketqua;
    }
    let canhbao = "";
    if(!chieucao)
    {
      canhbao  += "bạn hãy nhập lại chiều cao\n";
    }
    if(!cannang)
    {
      canhbao  += "bạn hãy nhập lại cân nặng\n";
    }
    if(canhbao)
    {
      alert(canhbao);
    }
    let tinh=cannang/(chieucao*chieucao);
    document.getElementById("images").value = tinh;
    if(tinh<18.5){
        document.getElementsByClassName("images").src = "thieucan.png";
    }
    else if(tinh>=18.5 && tinh<24.9){
        document.getElementsByClassName("images").src = "binhthuong.png";
    }
    else if(tinh>=25 && tinh<29.9){
        document.getElementsByClassName("images").src = "thuacan.png";
    }
    else if(tinh >=30 && tinh<39.9){
        document.getElementsByClassName("images").src = "beophi12.png";
    }
    
    else{
        document.getElementsByClassName("images").src = "beophinang.png";
    }
    
  </script>

</body>
</html>
