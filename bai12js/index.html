<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>tinh tong</h1>
  <div>
    <p>nhap so thu nhat</p>
    <input type="text" id="so1" value="">

  </div>

  <div>
    <p>nhap so thu hai</p>
    <input type="text" id="so2" value="">
  </div>

  <div>
    <button onclick="tinhTong()">tinh tong</button>
  </div>

  <div>
    ket qua: <input type="number" id="ketqua" class="ketqua">
  </div>


  <script>
  

  function tinhTong(){
    let so1 = document.getElementById("so1").value;
    let so2 = document.getElementById("so2").value;
    let tong = parseFloat(so1) + parseFloat(so2);
    document.getElementById("ketqua").value = tong;
    let canhbao = "";
    if(!so1)
    {
      canhbao  += "ban chua nhap so thu nhat\n";
    }
    if(!so2)
    {
      canhbao  += "ban chua nhap so thu hai\n";
    }
    if(canhbao)
    {
      alert(canhbao);
    }
    let ketqua = document.getElementById("ketqua");
    if(!ketqua)
    {
      alert("ban chua nhap so thu hai\n");
    }

  }

  </script>
  
</body>
</html>
