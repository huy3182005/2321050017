<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Vòng lặp số</title>
</head>
<body>
  
  <h1>Tính Tổng</h1>
  <div>
    <p>Nhập A</p>
    <input type="text" id="so1" value="">

  </div>

  <div>
    <p>Nhập B</p>
    <input type="text" id="so2" value="">
  </div>
  

  <div>
    <button onclick="tinhToan('tinhtong')">Tính Tổng</button>
  </div>
  
 
  <div>
    <button onclick="tinhToan('tinhhieu')">Tính hiệu</button>
  </div>
  
  
  <div>
    <button onclick="tinhToan('tinhtich')">Tính tích</button>
  </div>
  
  
  <div>
    <button onclick="tinhToan('tinhthuong')">Tính thương</button>
  </div>
  
  <div>
    Kết quả: <input type="number" id="ketqua" >
  </div>


  <script>
  function tinhToan(pheptinh){
    let a = parseFloat(document.getElementById("so1").value) ;
    let b = parseFloat(document.getElementById("so2").value) ;
    let tong = a + b;
    document.getElementById("ketqua").value = tong;
    if(pheptinh == 'tinhtong'){
      let tong = a + b;
      document.getElementById("ketqua").value = tong;
    }
    else if(pheptinh == 'tinhhieu'){
      let hieu = a - b;
      document.getElementById("ketqua").value = hieu;
    }
    else if(pheptinh == 'tinhtich'){
      let tich = a * b;
      document.getElementById("ketqua").value = tich;
    }
    else if(pheptinh == 'tinhthuong'){
      let thuong = a / b;
      document.getElementById("ketqua").value = thuong;
    }


    let canhbao = "";

    if(!a)
    {
      canhbao  += "bạn hãy nhập lại A\n";
    }
    if(!b)
    {
      canhbao  += "bạn hãy nhập lại B\n";
    }
   
    if  (a <= 0 || a >= 10) {
      canhbao += "Số A phải lớn hơn 0 và nhỏ hơn 10\n";
    }
    if  (b <= 0 || b >= 10) {
      canhbao += "Số B phải lớn hơn 0 và nhỏ hơn 10\n";
    }
  
    if(canhbao)
    {
      alert(canhbao);
    }
  }



  </script>
</body>
</html>
