//string:jsbuoi2
let hoten = "Pham Quang Huy";

let mystring = "Hello Kien";
document.writeln(mystring[4] + "<br>");

document.writeln(mystring.startsWith("Hello") + "<br>");
document.writeln(mystring.endsWith("Kien") + "<br>");
